version: "3"

services:
  app:
    build:
      dockerfile: Dockerfile
    container_name: app
    ports:
      - 8000:8000
      - 50051:50051
      - 8080:8080
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=orders
      - WEB_SERVER_PORT=:8000
      - GRPC_SERVER_PORT=50051
      - GRAPHQL_SERVER_PORT=8080
      - MQ_USER=guest
      - MQ_PASSWORD=guest
      - MQ_HOST=rabbitmq
      - MQ_PORT=5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ordersystem-network
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_PASSWORD: root
    ports:
      - 3306:3306
    volumes:
      - .docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ordersystem-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ordersystem-network

  migrate:
    image: migrate/migrate
    container_name: migrate
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./internal/infra/sql/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=mysql://root:root@tcp(mysql:3306)/orders"
      - "up"
    networks:
      - ordersystem-network

networks:
  ordersystem-network:
    name: ordersystem-network
    driver: bridge
